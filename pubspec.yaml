name: jc_connect_app
description: JC Connect, the community app for the college's students, parents, teachers and old boys.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  intl: any
  material_ui: ^1.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/jc_logo.png
    - assets/icons/
