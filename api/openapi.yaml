          type: boolean
        classes:
          type: boolean
        houses:
          type: boolean
      required:
      - academic_tracks
      - academic_years
      - classes
      - grades
      - houses
    SignupMemberTypeEnum:
      enum:
      - student
      - guardian
      - staff
      - alumni
      type: string
      description: |-
        * `student` - Student
        * `guardian` - Guardian
        * `staff` - Staff
        * `alumni` - Alumni
    SignupRequest:
      type: object
      description: Send the one matching the member's type (the others are refused).
      properties:
        student_profile:
          $ref: '#/components/schemas/StudentProfileInputRequest'
        staff_profile:
          $ref: '#/components/schemas/StaffProfileInputRequest'
        alumni_profile:
          $ref: '#/components/schemas/AlumniProfileInputRequest'
        member_type:
          $ref: '#/components/schemas/SignupMemberTypeEnum'
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          pattern: ^\+[1-9]\d{6,14}$
          maxLength: 16
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: At least 8 characters, with an uppercase letter and a number.
          maxLength: 128
        birthday:
          type: string
          format: date
          nullable: true
        address_line1:
          type: string
          minLength: 1
          default: ''
          maxLength: 255
        accept_terms:
          type: boolean
          default: false
        news_opt_in:
          type: boolean
          default: false
          description: Send me school news.
        enrollment:
          allOf:
          - $ref: '#/components/schemas/EnrollmentInputRequest'
          description: 'Students: their class.'
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/GuardianContactRequest'
          maxItems: 4
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildRequest'
          maxItems: 6
      required:
      - first_name
      - last_name
      - member_type
      - password
      - phone
    SignupToken:
      type: object
      properties:
        signup_token:
          type: string
          description: Send as `X-Signup-Token`.
        expires_in:
          type: integer
      required:
      - expires_in
      - signup_token
    SignupTokenEnvelope:
      type: object
