openapi: 3.0.3
info:
  title: JSC School Platform API
  version: 1.0.0
paths:
  /api/v1/academic-tracks:
    get:
      operationId: api_v1_academic_tracks_list
      description: |-
        View mixin: one required permission per HTTP method.

        ``required_perms = {"GET": "users.view", "POST": "users.manage"}``; a tuple
        means any one of them (``("groups.manage", "clubs.manage_assigned")``).
        A method missing from the map is denied (fail closed).
      parameters:
      - in: header
        name: X-Client
        schema:
          type: string
          enum:
          - mobile
          - web
        description: Calling client; must match the token audience.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: status
        required: false
        in: query
        description: 'Default: active and inactive (everything not archived).'
        schema:
          type: string
          enum:
          - active
          - inactive
          - archived
      tags:
      - academic setup
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrackList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    post:
      operationId: api_v1_academic_tracks_create
      description: |-
        View mixin: one required permission per HTTP method.

        ``required_perms = {"GET": "users.view", "POST": "users.manage"}``; a tuple
        means any one of them (``("groups.manage", "clubs.manage_assigned")``).
        A method missing from the map is denied (fail closed).
      parameters:
      - in: header
        name: X-Client
        schema:
          type: string
          enum:
          - mobile
          - web
        description: Calling client; must match the token audience.
        required: true
      tags:
      - academic setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
